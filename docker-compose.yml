services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contractai
      POSTGRES_USER: contractai
      POSTGRES_PASSWORD: contractai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://contractai:contractai@postgres:5432/contractai
      JWT_SECRET: local-development-secret-change-me
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      MAX_FILE_SIZE_MB: 15
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  frontend:
    image: python:3.11-slim
    working_dir: /site
    volumes:
      - ./frontend:/site:ro
    command: python -m http.server 5500 --bind 0.0.0.0
    ports:
      - "5500:5500"
    depends_on:
      - backend
volumes:
  postgres_data:
